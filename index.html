<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RotaFácil — Planejador de Viagens</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="cabecalho">
    <h1 class="cabecalho__titulo"><span id="nome-do-sistema">—</span></h1>
    <p class="cabecalho__subtitulo">
      <span id="versao">—</span> · <span id="data-de-hoje">—</span>
    </p>
    <div class="cabecalho__acoes">
      <span id="usuario-nome"></span>
      <button id="botao-sair" class="botao botao--pequeno" type="button" hidden>Sair</button>
    </div>
  </header>

  <section id="tela-entrada" class="cadastro">
    <form id="form-entrar" class="form-auth">
      <h2 class="cadastro__titulo">Entrar</h2>
      <div class="campo">
        <label for="entrar-email">E-mail</label>
        <input id="entrar-email" type="email" />
      </div>
      <div class="campo">
        <label for="entrar-senha">Senha</label>
        <input id="entrar-senha" type="password" />
      </div>
      <button class="botao" type="submit">Entrar</button>
    </form>

    <form id="form-criar" class="form-auth" hidden>
      <h2 class="cadastro__titulo">Criar conta</h2>
      <div class="campo">
        <label for="criar-nome">Nome</label>
        <input id="criar-nome" type="text" />
      </div>
      <div class="campo">
        <label for="criar-email">E-mail</label>
        <input id="criar-email" type="email" />
      </div>
      <div class="campo">
        <label for="criar-senha">Senha (6 caracteres ou mais)</label>
        <input id="criar-senha" type="password" />
      </div>
      <button class="botao" type="submit">Criar conta</button>
    </form>

    <button class="botao botao--pequeno botao--link" id="alternar-entrada" type="button">
      Ainda não tenho conta
    </button>
    <p class="mensagem mensagem--erro" id="erro-entrada" role="alert"></p>
  </section>

  <main id="tela-app" hidden>
    <section class="painel">
      <div class="estatistica">
        <span class="estatistica__numero" id="total">0</span>
        <span class="estatistica__rotulo">total</span>
      </div>
      <div class="estatistica">
        <span class="estatistica__numero" id="planejadas">0</span>
        <span class="estatistica__rotulo">planejadas</span>
      </div>
      <div class="estatistica">
        <span class="estatistica__numero" id="confirmadas">0</span>
        <span class="estatistica__rotulo">confirmadas</span>
      </div>
      <div class="estatistica">
        <span class="estatistica__numero" id="concluidas">0</span>
        <span class="estatistica__rotulo">concluídas</span>
      </div>
    </section>

    <p class="aviso aviso--oculto" id="aviso-urgente">
      Atenção: há viagens planejadas aguardando confirmação.
    </p>

    <p class="aviso" id="comece-por" hidden></p>
    <p class="aviso aviso--erro" id="erro-api" hidden></p>

    <section class="cadastro">
      <h2 class="cadastro__titulo">Cadastrar viagem</h2>
      <form id="form-viagem" novalidate>
        <div class="campo">
          <label for="destino">Destino</label>
          <input type="text" id="destino" placeholder="Ex.: Roma" />
        </div>
        <div class="campo">
          <label for="pais">País</label>
          <input type="text" id="pais" placeholder="Ex.: Itália" />
        </div>
        <div class="campo">
          <label for="situacao">Situação</label>
          <select id="situacao">
            <option value="planejada">Planejada</option>
            <option value="confirmada">Confirmada</option>
            <option value="concluida">Concluída</option>
          </select>
        </div>
        <div class="campo">
          <label for="tipo">Tipo</label>
          <select id="tipo">
            <option value="lazer">Lazer</option>
            <option value="trabalho">Trabalho</option>
            <option value="familia">Família</option>
          </select>
        </div>
        <div class="campo campo--largo">
